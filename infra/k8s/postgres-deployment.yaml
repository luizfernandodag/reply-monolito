apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13
        env:
        - name: POSTGRES_USER
          value: "devuser"
        - name: POSTGRES_PASSWORD
          value: "devpass"
        - name: POSTGRES_DB
          value: "projectdb"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: pgdata-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata-storage
        persistentVolumeClaim:
          claimName: postgres-pv-claim
